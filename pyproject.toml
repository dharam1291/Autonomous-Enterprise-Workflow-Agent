[project]
name = "autonomous-enterprise-workflow-agent"
version = "0.1.0"
description = "FastAPI POC for agentic healthcare/insurance claim review with HITL pause/resume."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "langgraph>=0.2.76",
    "openai>=1.58.0",
    "anthropic>=0.42.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pdf = [
    "pypdf>=4.2.0",
]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
