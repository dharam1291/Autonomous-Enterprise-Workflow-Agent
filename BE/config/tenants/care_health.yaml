# Care Health tenant. Enabled provider with its own policy-number format and
# coverage/HITL thresholds. Same section structure as every other tenant.
tenant_id: ch
provider_id: care_health
display_name: Care Health
enabled: true

features:
  pdf_ingestion: true
  auto_processing: true
  auto_approval: true
  hitl_review: true
  rejection_letter_generation: true

llm:
  provider: deterministic
  model: local-regex-extractor
  temperature: 0
  max_tokens: 1200

business_rules:
  - id: POLICY_NUMBER_FORMAT
    description: Care Health policy number format is valid.
    type: regex_match
    severity: ERROR
    enabled: true
    parameters:
      entity: policy_number
      pattern: "CAR-\\d{6}"
  - id: POLICY_COVERAGE_LIMIT
    description: Claim amount is within Care Health policy coverage limit.
    type: decimal_lte
    severity: ERROR
    enabled: true
    parameters:
      entity: claim_amount
      max: 75000

hitl_rules:
  - id: CARE_HEALTH_HIGH_VALUE_REVIEW
    description: Care Health claim amount is within automatic processing threshold.
    type: decimal_gt
    severity: WARNING
    enabled: true
    parameters:
      entity: claim_amount
      threshold: 15000
