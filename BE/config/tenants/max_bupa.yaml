# Max Bupa tenant. Active provider (enabled=true) running on the deterministic
# engine. Its business rules enforce a MAX-###### policy-number format and a
# 100,000 coverage limit; claims above 20,000 route to human review.
tenant_id: mb
provider_id: max_bupa
display_name: Max Bupa
enabled: true

features:
  pdf_ingestion: true
  auto_processing: true
  auto_approval: true
  hitl_review: true
  rejection_letter_generation: true

llm:
  provider: openai #deterministic
  model: gpt-4.1-mini #local-regex-extractor
  temperature: 0
  max_tokens: 1200

business_rules:
  - id: POLICY_NUMBER_FORMAT
    description: Max Bupa policy number format is valid.
    type: regex_match
    severity: ERROR
    enabled: true
    parameters:
      entity: policy_number
      pattern: "MAX-\\d{6}"
  - id: POLICY_COVERAGE_LIMIT
    description: Claim amount is within Max Bupa policy coverage limit.
    type: decimal_lte
    severity: ERROR
    enabled: true
    parameters:
      entity: claim_amount
      max: 100000

hitl_rules:
  - id: MAX_BUPA_HIGH_VALUE_REVIEW
    description: Max Bupa claim amount is within automatic processing threshold.
    type: decimal_gt
    severity: WARNING
    enabled: true
    parameters:
      entity: claim_amount
      threshold: 20000


